<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <style>
    .pricing-table-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      overflow-x: auto;
      font-family: Arial, sans-serif;
    }

    .pricing-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .pricing-table th, 
    .pricing-table td {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    /* Column Widths */
    .pricing-table th:first-child,
    .pricing-table td:first-child {
      width: 36%;
    }

    .pricing-table th:not(:first-child),
    .pricing-table td:not(:first-child) {
      width: 16%;
      text-align: center;
    }

    /* Sticky Header */
    .pricing-table thead th {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      z-index: 10;
      vertical-align: bottom;
    }

    .plan-name {
      font-size: 1.25rem;
      margin: 0 0 4px 0;
    }

    .plan-price {
      color: #2563eb;
      font-size: 1rem;
      font-weight: bold;
      margin: 0;
    }

    .check {
      color: #2563eb;
      font-weight: bold;
    }

    .cross {
      color: #9ca3af;
    }
  </style>
</head>
<body>

<div class="pricing-table-container">
  <table class="pricing-table">
    <thead>
      <tr>
        <th scope="col">Features</th>
        <th scope="col">
          <h3 class="plan-name">Free</h3>
          <p class="plan-price">Free</p>
        </th>
        <th scope="col">
          <h3 class="plan-name">Basic</h3>
          <p class="plan-price">3,000 EGP/year</p>
        </th>
        <th scope="col">
          <h3 class="plan-name">Pro</h3>
          <p class="plan-price">9,000 EGP/year</p>
        </th>
        <th scope="col">
          <h3 class="plan-name">Premium</h3>
          <p class="plan-price">16,000 EGP/year</p>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Included Total Students</th>
        <td>20</td>
        <td>50</td>
        <td>200</td>
        <td>500</td>
      </tr>
      <tr>
        <th scope="row">Extra Students Price</th>
        <td>200 EGP</td>
        <td>150 EGP</td>
        <td>100 EGP</td>
        <td>50 EGP</td>
      </tr>
      <tr>
        <th scope="row">AI Features</th>
        <td><span class="cross" aria-label="No">—</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
      </tr>
      <tr>
        <th scope="row">Zoom Attendance</th>
        <td><span class="cross" aria-label="No">—</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
      </tr>
      <tr>
        <th scope="row">Secure Videos</th>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
      </tr>
      <tr>
        <th scope="row">Zoom AI Attendance Taking</th>
        <td><span class="cross" aria-label="No">—</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
      </tr>
      <tr>
        <th scope="row">Assistants</th>
        <td><span class="cross" aria-label="No">—</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
        <td><span class="check" aria-label="Yes">✓</span></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>

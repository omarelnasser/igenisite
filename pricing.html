<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .pricing-table {
      width: 100%;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }

    .table-row {
      display: grid;
      grid-template-columns: 2fr repeat(4, 1fr); /* 1st column is 2x wider */
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-row {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      font-weight: bold;
      z-index: 10;
    }

    .plan-header {
      text-align: center;
    }

    .plan-name { font-size: 1.25rem; }
    .plan-price { color: #6b7280; font-size: 0.875rem; }
    .btn-upgrade {
      background-color: #2563eb;
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .feature-col {
      text-align: left;
      color: #1f2937;
    }

    .plan-data-col {
      text-align: center;
    }

    .check {
      color: #2563eb; /* Color for 'yes' checks */
      font-weight: bold;
    }

    .cross {
      color: #9ca3af; /* Color for 'no' dashes/x's */
    }
  </style>
</head>
<body>

<div class="pricing-table">
  <!-- Table Header Row -->
  <div class="table-row header-row">
    <div class="feature-col">Features</div>
    <div class="plan-header">
      <h3 class="plan-name">Free</h3>
      <p class="plan-price">Free</p>
    </div>
    <div class="plan-header">
      <h3 class="plan-name">Basic</h3>
      <button class="btn-upgrade">Upgrade</button>
    </div>
    <div class="plan-header">
      <h3 class="plan-name">Pro</h3>
      <button class="btn-upgrade">Upgrade</button>
    </div>
    <div class="plan-header">
      <h3 class="plan-name">Prem</h3>
      <button class="btn-upgrade">Upgrade</button>
    </div>
  </div>

  <!-- Row 1: Users -->
  <div class="table-row">
    <div class="feature-col">Users Included</div>
    <div class="plan-data-col">20</div>
    <div class="plan-data-col">50</div>
    <div class="plan-data-col">200</div>
    <div class="plan-data-col">500</div>
  </div>

  <!-- Row 2: AI Features -->
  <div class="table-row">
    <div class="feature-col">AI Features</div>
    <div class="plan-data-col"><span class="cross">—</span></div>
    <div class="plan-data-col"><span class="check">✓</span></div>
    <div class="plan-data-col"><span class="check">✓</span></div>
    <div class="plan-data-col"><span class="check">✓</span></div>
  </div>

  <!-- Row 3: Extra User Price -->
  <div class="table-row">
    <div class="feature-col">Extra User Price</div>
    <div class="plan-data-col">200 EGP</div>
    <div class="plan-data-col">150 EGP</div>
    <div class="plan-data-col">100 EGP</div>
    <div class="plan-data-col">50 EGP</div>
  </div>
</div>

</body>
</html>
